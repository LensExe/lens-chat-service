server:
  address: ':8080'
  mode: release
  shutdown-timeout: 10s
mongo:
  uri: 'mongodb://localhost:27018/'
  database: chat_direct
keycloak:
  issuer: 'https://identity.example.com/realms/application'
  audience: chat-service
  public-key-file: './config/keycloak-public.pem'
auth:
  disabled: false
  default-user-id: ''
cors:
  allow-origins:
    - 'http://localhost:3000'
kafka:
  # Comma-separated broker list. Outbox records already written remain in Mongo while Kafka is unavailable.
  brokers: 'localhost:9092'
  client-id: 'chat-service'
  chat-events-topic: 'chat.conversation.events.v1'
  # Optional SASL/PLAIN credentials; keep secrets in environment, not this file.
  username: ''
  password: ''
  # Set true when the broker listener uses TLS.
  ssl: false
  outbox-poll-interval: 1s
  outbox-lease-duration: 30s
  publish-timeout: 10s
